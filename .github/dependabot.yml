version: 2

# Dependency currency is a named control, not housekeeping: HIPAA 164.308(a)(5)(ii)(B) on
# protection from malicious software, PCI-DSS Req 6.3.x on identifying and addressing
# vulnerabilities, and SOC 2 CC7.1. Automating it is the difference between a policy and a habit.
updates:
  # "npm" is the ecosystem identifier for the whole Node family, pnpm-lock.yaml included. There is
  # no separate "pnpm" value.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Grouped, because a monorepo on separate PRs per package produces a wall of noise that gets
    # ignored, and an ignored dependency PR is worse than none: it trains you to dismiss them.
    #
    # The grouping below is deliberately shaped by what went wrong on 2026-08-10, when six separate
    # PRs were open at once. Every one of them rewrote pnpm-lock.yaml, so they could not be merged
    # in sequence without rebasing and re-testing each survivor, and the combination none of them
    # had been tested in was the thing actually being shipped. Six PRs also made enough noise to
    # hide the real problem: all six were failing one check that none of them had caused.
    #
    # ORDER MATTERS. A dependency lands in the FIRST group whose patterns and update-types it
    # matches, so the two cohesion groups come before the catch-all. Everything after them that is
    # not a major arrives as one pull request.
    groups:
      # These two stay separate from the catch-all because their packages must move TOGETHER, at
      # every semver level: a @nestjs/core that outruns @nestjs/common is a broken build, and
      # @prisma/client is generated against its own prisma CLI version. No update-types filter, so
      # majors group too, which is the point.
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      # Everything else, provided it is not a major: one pull request, one lockfile, one CI run,
      # one review. This is what collapses six PRs into one.
      #
      # Majors are excluded on purpose and therefore arrive individually, which is exactly the
      # handling they deserve. ioredis 6 in that batch changed the default wire protocol to RESP3
      # and raised the minimum Redis version; grouped in with four dev-tooling patches it would
      # have been reviewed as a lockfile diff.
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node MUST track the Node major this kit targets, which is the current LTS (24),
      # not npm's "latest" dist-tag. Dependabot proposed 24 -> 26 within an hour of being
      # enabled, and CI passed it: @types/node 26 compiles this repo clean while describing
      # APIs Node 24 does not have, so you get green typechecks for code that throws at
      # runtime. A test cannot catch that, so it is pinned here instead. Raise the major
      # deliberately when .nvmrc moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are never routine here: 7 removed the programmatic compiler API that
      # `nest build` depends on. Upgrade by hand, after checking the toolchain still works.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    # Security patches should not wait for the weekly window, and Dependabot raises those
    # separately from version updates regardless of this schedule.

  # Both workflows pin every action to a full commit SHA rather than a tag; the reasoning is at the
  # top of ci.yml. Dependabot understands SHA pins and maintains them, updating the SHA and rewriting
  # the trailing version comment, so pinning does not mean upgrading by hand.
  #
  # Review these like any other dependency PR. A SHA bump is unreadable on its own, so the check is
  # that the new SHA really is the tag the comment claims, which is one API call:
  #   gh api repos/<owner>/<repo>/commits/<version> --jq .sha
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
