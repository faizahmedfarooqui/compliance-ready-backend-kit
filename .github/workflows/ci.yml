name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a stale CI result on an old commit is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Non-secret local-equivalent values. CI runs against a throwaway service container, so
  # these are deliberately not secrets and must never be reused anywhere real. Ports match
  # docker-compose.yml, which avoids the defaults so a developer's own Postgres is not hit.
  MASTER_DATABASE_URL: postgres://postgres:postgres@localhost:55432/master
  TENANT_CLUSTER_URL: postgres://postgres:postgres@localhost:55432
  REDIS_URL: redis://localhost:56379
  JWT_ISSUER: compliance-ready-backend-kit
  JWT_AUDIENCE: compliance-kit-api
  JWT_CLOCK_TOLERANCE_SECONDS: "5"
  # The key-encrypting key. The token keys themselves are generated into config_keys by
  # `pnpm keys:init`, wrapped by this. CI-only throwaway, committed on purpose so the run is
  # reproducible, and therefore public.
  KEY_ENCRYPTION_KEY: ci0only0000000000000000000000000000000000AA
  # Gates POST /api/tenants, which the smoke test calls. CI-only throwaway, committed on purpose.
  CONTROL_PLANE_API_KEY: ci0only0000000000000000000000000000000000CP
  PORT: "3011"

jobs:
  # Needs no database, so it runs in parallel with the end-to-end job below and fails fast.
  quality:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first. The lint config uses type-aware rules, which resolve `@compliance-kit/*`
      # through each package's "types" field into dist/. With nothing built, every cross-package
      # import becomes an unresolved type and the run drowns in ~235 no-unsafe-* errors that say
      # nothing about the code. Same reason typecheck is ordered after build in the job below.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Unit tests do not need the build (they alias workspace imports to source) but run here
      # anyway so a single job covers everything that does not need Postgres.
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  verify:
    name: Build, typecheck, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master
        ports:
          - 55432:5432
        # The smoke test provisions databases immediately, so the job must not start
        # until Postgres is genuinely accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d master"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # .nvmrc is the single source of truth for the Node version, so CI and a developer's
      # `nvm use` cannot drift. It tracks the current Node LTS line.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build BEFORE typecheck, not after. The workspace packages resolve each other through
      # their package.json "main"/"types", which point into dist/, and dist/ is gitignored. On a
      # fresh clone nothing has been emitted yet, so typechecking first fails with
      # "Cannot find module '@compliance-kit/common'" in every package that imports a sibling.
      # Building emits the declaration files that typecheck then resolves against.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply master schema
        run: pnpm db:migrate

      # Fails the build if the committed tenant DDL no longer matches the tenant schema.
      # That file is applied to every new tenant database, so drift means new tenants get a
      # schema nobody reviewed.
      - name: Check generated tenant DDL is current
        run: |
          pnpm db:tenant-ddl
          if ! git diff --exit-code -- packages/db/sql/tenant-schema.sql; then
            echo "::error::packages/db/sql/tenant-schema.sql is stale."
            echo "Run 'pnpm db:tenant-ddl' and commit the result."
            exit 1
          fi

      # The service has no token keys until this runs, so every login would fail. Deliberately an
      # operational step rather than something a migration does: a migration is committed to git and
      # replayed into a shadow database, so any key it generated would be public and identical
      # everywhere. See packages/db/src/keys/manage-keys.ts.
      - name: Initialise token keys
        run: pnpm keys:init

      # Readiness is polled from the health endpoint rather than grepped out of the log. A log line
      # says a message was printed; a 200 from /api/health says the server is actually accepting
      # connections, which is the thing the next step depends on.
      - name: Start auth-service
        run: |
          pnpm start:auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${PORT}/api/health" > /tmp/health.json 2>/dev/null; then
              echo "auth-service ready: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::auth-service did not become ready"
          cat /tmp/auth.log
          exit 1

      - name: Smoke test
        run: pnpm smoke

      # A raw-socket check, so it cannot live in the HTTP smoke test. It reproduces the dribbled-body
      # slowloris attack and asserts the server answers 408 and hangs up.
      #
      # Run with a short timeout so CI does not wait 30s. That is not weakening the test: the mechanism
      # is what this proves, and the 30s production default is asserted by the config unit tests. The
      # service is restarted with the short value because the timeout is fixed at construction.
      - name: Slowloris probe (request timeout is actually in effect)
        run: |
          set -euo pipefail

          # stop-auth.sh kills by port using lsof, and swallows lsof's absence so it can report
          # "nothing listening" rather than failing. That would be the worst outcome here: the old
          # server would survive, the new one would fail to bind, and the probe would run against a
          # 30s timeout while expecting 4s, failing for a reason that has nothing to do with the code.
          command -v lsof >/dev/null || {
            echo "::error::lsof is not available, so the port cannot be freed reliably"
            exit 1
          }
          ./scripts/stop-auth.sh

          # The timeout is fixed when the HTTP server is constructed, so a shorter one needs a restart.
          REQUEST_TIMEOUT_MS=4000 CONNECTIONS_CHECKING_INTERVAL_MS=1000 \
            pnpm start:auth > /tmp/auth-slow.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:${PORT}/api/health" >/dev/null 2>&1 && break
            sleep 1
          done

          # Confirm this is the RESTARTED process. Same reasoning as step 0 of the smoke test: a stale
          # server answers every request happily and the suite reports on the wrong build.
          uptime=$(curl -fsS "http://localhost:${PORT}/api/health" | jq -r '.data.uptimeSeconds')
          if [ "$uptime" -ge 60 ]; then
            echo "::error::still talking to the previous server (uptime ${uptime}s), not the restart"
            cat /tmp/auth-slow.log
            exit 1
          fi

          REQUEST_TIMEOUT_MS=4000 pnpm smoke:slowloris

      # The rest of the key lifecycle, after the smoke test rather than before it so revoking a key
      # cannot invalidate a token the smoke test is still using.
      #
      # This runs here because it is not unit testable in any way worth trusting. What makes rotation
      # correct is the database: the partial unique index that permits exactly one active key per
      # purpose, and the single transaction that retires the old key and promotes the new one. A fake
      # ConnectionManager would assert my beliefs about those constraints rather than the constraints,
      # so manage-keys.ts is excluded from unit coverage and proved here against real Postgres
      # instead. See the coverage exclusions in vitest.config.ts.
      - name: Key rotation and revocation
        run: |
          set -euo pipefail

          pnpm keys:rotate --purpose signing
          pnpm keys:list | tee /tmp/keys.txt

          # One active signing key, and exactly one retiring one carrying the overlap window.
          active=$(grep -c 'token_signing *active' /tmp/keys.txt || true)
          retiring=$(grep -c 'token_signing *retiring .* until ' /tmp/keys.txt || true)
          if [ "$active" != "1" ] || [ "$retiring" != "1" ]; then
            echo "::error::after rotation expected 1 active + 1 retiring signing key, got ${active} + ${retiring}"
            exit 1
          fi

          # Revoking the ACTIVE key must be refused: it would leave the service unable to issue
          # tokens at all. `!` rather than `|| true` so a zero exit here fails the build.
          active_kid=$(awk '/token_signing *active/ { print $4 }' /tmp/keys.txt)
          if pnpm keys:revoke --kid "$active_kid" --reason "ci-should-refuse" 2>/tmp/revoke.txt; then
            echo "::error::revoking the active key succeeded; it must be refused"
            exit 1
          fi
          grep -q 'is the ACTIVE' /tmp/revoke.txt

          # Revoking the retiring key is allowed, and destroys its material.
          retiring_kid=$(awk '/token_signing *retiring/ { print $4 }' /tmp/keys.txt)
          pnpm keys:revoke --kid "$retiring_kid" --reason "ci-lifecycle-check"
          pnpm keys:list | grep -q "revoked .* ${retiring_kid}"

      - name: Service log
        if: always()
        run: cat /tmp/auth.log || true
