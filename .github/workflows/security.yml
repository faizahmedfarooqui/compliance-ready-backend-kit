name: Security

# Actions are pinned to full commit SHAs with the version in a trailing comment. The reasoning is in
# ci.yml and applies with more force here: this workflow is the evidence that the security gates ran,
# so an action that could be swapped under a moved tag would undermine the one job whose output is
# meant to be trustworthy.

# Separate from ci.yml on purpose. These checks answer a different question ("is there a known
# vulnerability or a leaked secret") and run on a schedule as well as per-change, because a
# dependency that was clean on Monday can have a published advisory by Friday without anyone
# touching the repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A compliance kit that only scans when someone happens to push is not scanning.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required so findings appear in the Security tab rather than only in the job log.
      security-events: write

    steps:
      # persist-credentials: false on every checkout. By default the job's GITHUB_TOKEN is left in
      # .git/config for the rest of the job, readable by every later step, third-party actions and
      # dependency install scripts included. No job here uses git credentials after checking out (the DDL
      # drift check's `git diff` is local, and gitleaks and dependency review use the API token), so
      # leaving it there would only widen what a compromised step could take.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # security-and-quality is broader than the default security-extended and includes
          # maintainability rules. For a kit whose readers are evaluating code quality as much as
          # its controls, the extra findings are the point.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails the build on a high or critical advisory. That is deliberately a gate and not a
      # report: a check that cannot fail is theatre, and this row of COMPLIANCE.md is meant to be
      # evidence. If an advisory is genuinely unfixable, triage it with a pnpm override or an
      # explicitly documented exception. Do not weaken the threshold to make the build pass.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on a pull request, where there is a base to diff the dependency graph against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, so a shallow clone would miss a secret committed earlier and
          # later removed, which is exactly the case that still needs rotating.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for repositories owned by an ORGANISATION, not by a user account. This repo is
          # under a user account, so it runs without one. If you fork this into an org, obtain a
          # free key from gitleaks.io and add it as a secret, or this job will fail.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
